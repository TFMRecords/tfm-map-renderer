openapi: 3.0.3
info:
  title: tfm-map-renderer PNG render server
  version: "0.3.0"
  description: >
    Renders Transformice map XML to PNG. Started with `npm run server`; see docs/api/http.md.
    Renderer options are described in docs/api/renderer.md.
  license:
    name: MIT
servers:
  - url: http://127.0.0.1:3000
paths:
  /render:
    post:
      summary: Render a map to PNG
      description: "`POST /` is the same endpoint."
      operationId: render
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenderRequest" }
      responses:
        "200":
          description: The rendered map. JSON by default; the bare PNG when `raw` is true, the bare SVG with `raw` and `rasterize` false.
          headers:
            x-map-width: { description: "Map width (only with raw: true).", schema: { type: integer } }
            x-map-height: { description: "Map height (only with raw: true).", schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RenderResponse" }
            image/png:
              schema: { type: string, format: binary }
            image/svg+xml:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /health:
    get:
      summary: Server status
      operationId: health
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  running: { type: integer, description: Renders in progress. }
                  waiting: { type: integer, description: Requests in the queue. }
                  backend: { type: string, enum: [compositor, resvg], description: The default renderer (--renderer). }
                  rasterizerProcesses: { type: integer, description: Child processes that rasterize (0 = in the server process). }
                  release: { type: boolean, description: Whether an asset release is loaded. }
                  mapImages: { type: boolean, description: Whether the server fetches map images (off with --no-map-images). }
components:
  responses:
    Error:
      description: >
        An error. When rasterising fails and the request has svg true, the body also has the rest of the answer except the image
        (svg, warnings, mapWidth, ...); with raw true it is the bare SVG and the message is in the x-render-error header.
      headers:
        x-render-error: { description: "The error message, when the body is the bare SVG.", schema: { type: string } }
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string }
              svg: { type: string, description: Only when rasterising failed and the request has svg true. }
        image/svg+xml:
          schema: { type: string }
  schemas:
    RenderRequest:
      type: object
      required: [xml]
      description: Renderer options may also be given at the top level; `mirror` is short for `mirrorX`. Unknown top-level fields are ignored.
      properties:
        xml: { type: string, description: Map XML, at most 2 MB. }
        width: { type: integer, minimum: 1, maximum: 8192, description: Output width; alone it keeps the aspect ratio. }
        height: { type: integer, minimum: 1, maximum: 8192, description: Output height; with width it stretches the map. }
        raw: { type: boolean, default: false, description: "Answer with the bare image/png (image/svg+xml with rasterize: false)." }
        svg: { type: boolean, default: false, description: Also return the SVG, also next to a rasterising error. }
        rasterize: { type: boolean, default: true, description: "false (needs svg: true) answers with the SVG only, at its own size; width, height and the pixel limits do not apply." }
        lenient: { type: boolean, default: true, description: false parses the XML strictly. }
        mapImages: { type: boolean, default: true, description: false skips the map's own images for this request. }
        renderer: { type: string, enum: [compositor, resvg], description: "How the PNG is drawn; default the server's --renderer (compositor unless set)." }
        mirror: { type: boolean, description: Same as options.mirrorX. }
        options: { $ref: "#/components/schemas/RenderOptions" }
    RenderOptions:
      type: object
      additionalProperties: false
      description: See docs/api/renderer.md for each option.
      properties:
        mirrorX: { type: boolean }
        minimalist: { type: boolean }
        restricted: { type: boolean }
        clientLimits:
          oneOf:
            - { type: string, enum: [unrestricted, restricted, module] }
            - type: object
              properties:
                preset: { type: string, enum: [unrestricted, restricted, module] }
                restricted: { type: boolean }
                arps: { type: boolean }
                maxWidth: { type: number, nullable: true }
                maxWidthDefilante: { type: number, nullable: true }
                maxHeight: { type: number, nullable: true }
                maxGrounds: { type: number, nullable: true }
                maxDecorations: { type: number, nullable: true }
                maxObjects: { type: number, nullable: true }
                maxObjectIndex: { type: number, nullable: true }
        backgroundColor: { type: string, nullable: true, maxLength: 64 }
        objectMode: { type: string, enum: [editor, game] }
        nailVisibility: { type: string, enum: [all, client] }
        objectPlaceholders: { type: boolean }
        spawnMarkers: { type: string, enum: [circles, editor, none] }
        renderJoints: { type: boolean }
        renderAppearingImages: { type: boolean }
        renderIpImages: { type: boolean }
        renderSoulmateHeart: { type: boolean }
        renderHideOffscreenFrame: { type: boolean }
        renderTiledBackgrounds: { type: boolean }
        compositeRandomBackground: { type: boolean }
        randomBackgroundIndex: { type: number }
        randomDecorationFlip: { type: boolean }
        textures: { type: boolean }
        textureSeed: { type: number }
        pregeneratedBitmaps: { type: boolean }
        cheeseSuffix: { type: string, maxLength: 64 }
        defaultAssets: { type: boolean }
        flashBlur: { type: boolean }
        scale: { type: number }
        rotation: { type: number }
        borders: { type: string, enum: [none, map, all] }
        debugMarkers: { type: boolean }
        fitContent: { type: boolean, default: false, description: "Without viewport: draw everything on the map and nothing more, whatever the map's size (the viewport can start left of or above 0, 0)." }
        viewport:
          type: object
          properties:
            x: { type: number }
            y: { type: number }
            width: { type: number }
            height: { type: number }
        modules:
          description: Lua module overlays; false turns them all off.
          oneOf:
            - { type: boolean, enum: [false] }
            - type: object
              additionalProperties: false
              properties:
                parkour:
                  oneOf:
                    - { type: string, enum: [auto] }
                    - { type: boolean }
        parkourNails:
          type: boolean
          default: true
          description: Draw each parkour checkpoint's nail again over its mouse, as Miceditor does.
        parkourStyle:
          type: object
          additionalProperties: false
          description: Look of the parkour overlay. Unset fields keep their defaults.
          properties:
            stopColor: { type: string, nullable: true, pattern: "^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$", description: Tint of a stop checkpoint's mouse; null is the default blue. }
            stopAmount: { type: number, minimum: 0, maximum: 1, default: 0.6, description: How far the mouse is mixed towards stopColor. }
            number: { $ref: "#/components/schemas/ParkourLabel" }
            size: { $ref: "#/components/schemas/ParkourLabel" }
    ParkourLabel:
      type: object
      additionalProperties: false
      description: "A parkour label: number defaults to height 9, size (the x2 label) to height 7; white on #1b1f2b."
      properties:
        height: { type: number, minimum: 1, maximum: 100, description: Digit height in map pixels. }
        color: { type: string, pattern: "^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$" }
        outline: { type: string, pattern: "^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$" }
    RenderResponse:
      type: object
      properties:
        image: { type: string, format: byte, description: "Base64 PNG; absent with rasterize: false." }
        mimeType: { type: string, example: image/png }
        width: { type: integer }
        height: { type: integer }
        mapWidth: { type: integer }
        mapHeight: { type: integer }
        backend: { type: string, enum: [compositor, resvg, svg], description: "What drew the picture: compositor, resvg (asked for, or the compositor-fallback warning), svg with rasterize: false." }
        clientLoads: { type: boolean, nullable: true, description: false when the game would fail to load the map. }
        warnings: { type: array, description: "The first 50 XML diagnostics, plus map-image-unavailable, map-cropped (with --max-map-size: x, y, width, height of the drawn part) and image-truncated (requestedWidth, requestedHeight, and the width and height drawn).", items: { type: object } }
        svg: { type: string, description: Only with svg true. }
        cached: { type: boolean, description: Present and true when answered from the result cache. }
        mapImages:
          type: object
          description: Only when the server fetches map images.
          properties:
            requested: { type: integer, description: Map images the renderer draws. }
            loaded: { type: integer }
            missing: { type: integer, description: Images that could not be loaded (also a map-image-unavailable warning). }
